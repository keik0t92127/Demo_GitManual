<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="640" height="220" fill="#f6f8fa" rx="12"/>

  <!-- Title -->
  <text x="320" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">コンフリクト解消の流れ (Conflict Resolution)</text>

  <!-- Steps -->
  <!-- Step 1 -->
  <rect x="30" y="50" width="140" height="70" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="100" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">① コンフリクト発生</text>
  <text x="100" y="97" text-anchor="middle" font-size="10" fill="#1e40af">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text>
  <text x="100" y="111" text-anchor="middle" font-size="10" fill="#1e40af">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature</text>

  <!-- Arrow 1→2 -->
  <line x1="174" y1="85" x2="216" y2="85" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="220" y="50" width="140" height="70" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="290" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#713f12">② 手動で編集</text>
  <text x="290" y="97" text-anchor="middle" font-size="10" fill="#713f12">マーカーを削除して</text>
  <text x="290" y="111" text-anchor="middle" font-size="10" fill="#713f12">内容を確定</text>

  <!-- Arrow 2→3 -->
  <line x1="364" y1="85" x2="406" y2="85" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="410" y="50" width="140" height="70" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="480" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">③ ステージ &amp; コミット</text>
  <text x="480" y="97" text-anchor="middle" font-size="10" fill="#166534">git add .</text>
  <text x="480" y="111" text-anchor="middle" font-size="10" fill="#166534">git commit</text>

  <!-- Tip box -->
  <rect x="30" y="145" width="580" height="55" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="50" y="166" font-size="11" font-weight="bold" fill="#9a3412">💡 ヒント</text>
  <text x="50" y="184" font-size="11" fill="#7c2d12">コンフリクト マーカー: &lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD (現在のブランチ) ／ ======= ／ &gt;&gt;&gt;&gt;&gt;&gt;&gt; feature (マージ元)</text>
  <text x="50" y="198" font-size="10" fill="#9a3412">マーカー行を含む不要な部分を削除し、残したい内容だけ残してください。</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
