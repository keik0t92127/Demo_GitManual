<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="640" height="260" fill="#f6f8fa" rx="12"/>

  <!-- Title -->
  <text x="320" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">ブランチ操作 (Branch Operations)</text>

  <!-- main branch line -->
  <line x1="40" y1="100" x2="600" y2="100" stroke="#3b82f6" stroke-width="3"/>
  <text x="20" y="104" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="bold">main</text>

  <!-- feature branch line -->
  <line x1="200" y1="100" x2="480" y2="180" stroke="#22c55e" stroke-width="3"/>
  <line x1="480" y1="180" x2="540" y2="180" stroke="#22c55e" stroke-width="3"/>
  <text x="320" y="198" text-anchor="middle" font-size="11" fill="#166534" font-weight="bold">feature</text>

  <!-- Merge back -->
  <line x1="540" y1="180" x2="600" y2="100" stroke="#a855f7" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- Commit circles on main -->
  <circle cx="80"  cy="100" r="10" fill="#3b82f6" stroke="white" stroke-width="2"/>
  <circle cx="200" cy="100" r="10" fill="#3b82f6" stroke="white" stroke-width="2"/>
  <circle cx="340" cy="100" r="10" fill="#3b82f6" stroke="white" stroke-width="2"/>
  <circle cx="600" cy="100" r="12" fill="#a855f7" stroke="white" stroke-width="2"/>

  <!-- Commit circles on feature -->
  <circle cx="320" cy="156" r="10" fill="#22c55e" stroke="white" stroke-width="2"/>
  <circle cx="420" cy="172" r="10" fill="#22c55e" stroke="white" stroke-width="2"/>
  <circle cx="540" cy="180" r="10" fill="#22c55e" stroke="white" stroke-width="2"/>

  <!-- Labels -->
  <text x="80"  y="82" text-anchor="middle" font-size="9" fill="#64748b">C1</text>
  <text x="200" y="82" text-anchor="middle" font-size="9" fill="#64748b">C2</text>
  <text x="340" y="82" text-anchor="middle" font-size="9" fill="#64748b">C3</text>
  <text x="600" y="82" text-anchor="middle" font-size="9" fill="#7e22ce">merge</text>

  <!-- branch point label -->
  <text x="200" y="128" text-anchor="middle" font-size="9" fill="#166534">git switch -c feature</text>

  <!-- git branch / git switch commands -->
  <rect x="30" y="215" width="580" height="35" rx="8" fill="#1e293b"/>
  <text x="320" y="233" text-anchor="middle" font-size="11" fill="#94a3b8">git switch -c feature</text>
  <text x="320" y="247" text-anchor="middle" font-size="11" fill="#94a3b8">   →  作業後に  git switch main  &amp;  git merge feature</text>
</svg>
